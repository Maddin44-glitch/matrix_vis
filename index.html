<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Visualizer</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.1.0/math.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Canvas Area -->
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
            <button class="reset-btn">RESET</button>
            <button id="light-mode-btn"
                style="position: absolute; top: 10px; right: 80px; background-color: #ffffff; color: #1a1f28; border: none; padding: 8px 14px; border-radius: 4px; font-family: 'Courier New', monospace; font-weight: bold; cursor: pointer; font-size: 12px; z-index: 10;">LIGHT</button>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Title -->
            <div style="margin-bottom: 12px;">
                <div style="font-size: 13px; font-weight: bold; color: var(--accent);">MATRIX VIZ</div>
                <div style="font-size: 9px; color: var(--subtext);">Raum-Transformation</div>
            </div>

            <div class="separator"></div>

            <!-- Mode Selection -->
            <div style="margin-bottom: 8px;">
                <div class="section-title">DIMENSION</div>
                <div class="mode-buttons">
                    <button class="mode-btn active" data-mode="2d">2D</button>
                    <button class="mode-btn" data-mode="3d">3D</button>
                </div>
            </div>

            <div class="separator"></div>

            <!-- Sliders -->
            <div style="margin-bottom: 8px;">
                <div class="section-title">VISUALISIERUNG</div>
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Zeit (t)</span>
                        <span id="t-value">0.50</span>
                    </div>
                    <input type="range" id="t-slider" min="0" max="1" step="0.01" value="0.5">
                </div>
                <div class="slider-group">
                    <div class="slider-label">
                        <span>Skalierung</span>
                        <span id="scale-value">1.00</span>
                    </div>
                    <input type="range" id="scale-slider" min="0.1" max="3" step="0.1" value="1">
                </div>
            </div>

            <div class="separator"></div>

            <!-- Show Basis Vectors & Grid -->
            <div style="margin-bottom: 8px;">
                <div class="section-title">OPTIONEN</div>
                <div class="checkbox-container">
                    <input type="checkbox" id="show-basis" />
                    <label class="checkbox-label" for="show-basis">Basisvektoren</label>
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="show-grid" checked />
                    <label class="checkbox-label" for="show-grid">Original-Koordinatensystem</label>
                </div>
            </div>

            <div class="separator"></div>

            <!-- Matrix Selection & Input -->
            <div style="margin-bottom: 8px;">
                <div class="section-title">MATRIX EINGABE</div>
                <div id="matrix-container"></div>
            </div>

            <div class="separator"></div>

            <!-- Operations Button (Hidden) -->
            <div style="margin-bottom: 8px; display: none;">
                <button class="btn" id="operations-btn" style="width: 100%;">▼ OPERATIONEN</button>
            </div>

            <!-- Operations Modal (Hidden) -->
            <div id="operations-modal"
                style="display: none; background: var(--entry-bg); border: 1px solid var(--border); padding: 8px; border-radius: 3px;">
                <div class="section-title">OPERATIONEN</div>
                <div class="operations-grid">
                    <button class="operation-btn" data-op="mult">Mult (×)</button>
                    <button class="operation-btn" data-op="add">Add (+)</button>
                    <button class="operation-btn" data-op="sub">Sub (−)</button>
                    <button class="operation-btn" data-op="inv">Inv (⁻¹)</button>
                    <button class="operation-btn" data-op="det">Det (|·|)</button>
                    <button class="operation-btn" data-op="transpose">Trans (ᵀ)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
